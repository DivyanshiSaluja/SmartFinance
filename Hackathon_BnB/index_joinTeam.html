<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join MoneyMantra Team</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #1e40af 50%, #0f172a 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #f1f5f9;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .header {
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .brand-name {
            background: linear-gradient(45deg, #f59e0b, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #94a3b8;
            max-width: 800px;
            margin: 0 auto;
        }

        .form-container {
            background: rgba(30, 64, 175, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 1rem;
        }

        .required {
            color: #ef4444;
        }

        input, textarea {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(100, 116, 139, 0.3);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.7);
            color: #f1f5f9;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
            background: rgba(15, 23, 42, 0.9);
        }

        input::placeholder, textarea::placeholder {
            color: #64748b;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background: linear-gradient(45deg, #10b981, #f59e0b);
            color: #0f172a;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 18px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .form-container {
                padding: 30px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .header p {
                font-size: 1.1rem;
            }
        }

        /* Success animation */
        .success-message {
            display: none;
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: 600;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Join the <span class="brand-name">MoneyMantra</span> team</h1>
            <p>If you're interested in joining our team or partnering up – feel free to reach out to us. We're interested to hear what your previous experience and background is and how you would add value to MoneyMantra</p>
        </div>

        <div class="form-container">
            <form id="contactForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="firstName">Full Name <span class="required">*</span></label>
                        <input type="text" id="firstName" name="firstName" placeholder="Place your first name here" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name <span class="required">*</span></label>
                        <input type="text" id="lastName" name="lastName" placeholder="Place your last name here" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="Place your email address here" required>
                    </div>
                    <div class="form-group">
                        <label for="linkedin">LinkedIn</label>
                        <input type="text" id="telegram" name="telegram" placeholder="Place your linkedIn id here">
                    </div>
                    <div class="form-group full-width">
                        <label for="message">Tell us about yourself</label>
                        <textarea id="message" name="message" placeholder="Drop us a note. Let us know why you want to work with us..."></textarea>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
                <div class="success-message" id="successMessage">
                    Thank you for your interest! We'll get back to you soon.
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Show success message
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';
            
            // Reset form after a delay
            setTimeout(() => {
                this.reset();
                successMessage.style.display = 'none';
            }, 3000);
        });

        // Add smooth focus animations
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
